name: Android APK Derleme
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Dosyaları Al
        uses: actions/checkout@v4

      - name: Sistem Bağımlılıklarını Kur
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3 \
            python3-dev \
            python3-pip \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            libncurses5:i386 \
            libstdc++6:i386 \
            libz1:i386

      - name: Buildozer ve Cython Kur
        run: |
          pip3 install --upgrade pip
          pip3 install --user --upgrade buildozer cython==0.29.33 virtualenv

      - name: APK Derle
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug

      - name: Çıktıyı Al
        uses: actions/upload-artifact@v4
        with:
          name: SifirBird-APK
          path: bin/*.apk
