name: Android APK Derleme
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Dosyaları Al
        uses: actions/checkout@v4

      - name: Python 3.10 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kurulumları Yap
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev python3-pip zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev
          pip3 install --user --upgrade buildozer cython virtualenv

      - name: APK Derle
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug

      - name: Çıktıyı Al
        uses: actions/upload-artifact@v4
        with:
          name: SifirBird-APK
          path: bin/*.apk
